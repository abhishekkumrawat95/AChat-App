<svg viewBox="0 0 768 1024" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
  <defs>
    <pattern id="tech-pattern" patternUnits="userSpaceOnUse" width="200" height="200">
      <!-- Gears -->
      <circle cx="50" cy="50" r="20" fill="none" stroke="#1a1a1a" stroke-width="1.5" opacity="0.6"/>
      <circle cx="50" cy="50" r="15" fill="none" stroke="#1a1a1a" stroke-width="0.8" opacity="0.4"/>
      <circle cx="150" cy="100" r="15" fill="none" stroke="#1a1a1a" stroke-width="1" opacity="0.5"/>
      
      <!-- Planets -->
      <circle cx="100" cy="30" r="12" fill="none" stroke="#1a1a1a" stroke-width="1" opacity="0.5"/>
      <circle cx="100" cy="30" r="18" fill="none" stroke="#1a1a1a" stroke-width="0.5" opacity="0.3"/>
      
      <!-- Circuits -->
      <line x1="30" y1="150" x2="70" y2="150" stroke="#1a1a1a" stroke-width="0.8" opacity="0.4"/>
      <circle cx="30" cy="150" r="2" fill="#1a1a1a" opacity="0.5"/>
      <circle cx="70" cy="150" r="2" fill="#1a1a1a" opacity="0.5"/>
      
      <!-- Stars -->
      <circle cx="140" cy="50" r="1.5" fill="#1a1a1a" opacity="0.6"/>
      <circle cx="70" cy="80" r="1" fill="#1a1a1a" opacity="0.4"/>
      <circle cx="160" cy="170" r="1.2" fill="#1a1a1a" opacity="0.5"/>
      
      <!-- Satellites -->
      <circle cx="180" cy="40" r="4" fill="none" stroke="#1a1a1a" stroke-width="0.8" opacity="0.5"/>
      <line x1="180" y1="40" x2="190" y2="45" stroke="#1a1a1a" stroke-width="0.5" opacity="0.3"/>
      
      <!-- Atoms -->
      <circle cx="20" cy="180" r="8" fill="none" stroke="#1a1a1a" stroke-width="0.8" opacity="0.4"/>
      <circle cx="20" cy="180" r="1.5" fill="#1a1a1a" opacity="0.5"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="768" height="1024" fill="#000000"/>
  
  <!-- Pattern fill -->
  <rect width="768" height="1024" fill="url(#tech-pattern)"/>
</svg>